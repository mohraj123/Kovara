version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-Kovara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Kovara}
      POSTGRES_DB: ${POSTGRES_DB:-Kovara}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-Kovara} -d ${POSTGRES_DB:-Kovara}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  indexer:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-Kovara}:${POSTGRES_PASSWORD:-Kovara}@postgres:5432/${POSTGRES_DB:-Kovara}
      HOST: 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
    driver: local
